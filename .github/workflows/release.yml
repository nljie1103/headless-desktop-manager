name: Publish versioned HDM release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and public release notes
        shell: bash
        run: |
          set -euo pipefail
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
          python3 scripts/validate-public-release.py
          bash tests/run.sh
      - name: Build release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/headless-desktop-manager
          tar --exclude=.git --exclude=dist --exclude='__pycache__' --exclude='*.pyc' -cf - . | tar -xf - -C dist/headless-desktop-manager
          tar -czf "hdm-${GITHUB_REF_NAME}.tar.gz" -C dist headless-desktop-manager
          sha256sum "hdm-${GITHUB_REF_NAME}.tar.gz" install.sh > SHA256SUMS
      - name: Publish release with user-facing title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          title=$(cat release/RELEASE_TITLE.txt)
          # Retagging a corrected history must update the existing Release
          # instead of failing with "a release with the same tag name exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file release/RELEASE_NOTES.md
            gh release upload "$GITHUB_REF_NAME" "hdm-${GITHUB_REF_NAME}.tar.gz" install.sh SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" "hdm-${GITHUB_REF_NAME}.tar.gz" install.sh SHA256SUMS \
              --title "$title" --notes-file release/RELEASE_NOTES.md
          fi
