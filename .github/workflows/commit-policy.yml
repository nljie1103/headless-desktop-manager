name: Commit Message Policy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit titles
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/check-commit-messages.py --range "$BASE_SHA..$PR_HEAD_SHA"
          elif [[ "$BEFORE" =~ ^0+$ ]] || [[ -z "$BEFORE" ]]; then
            python3 scripts/check-commit-messages.py --range HEAD
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Normal pushes compare the two tips. For a rewritten branch,
            # verify everything since the nearest common ancestor.
            base=$(git merge-base "$BEFORE" HEAD)
            python3 scripts/check-commit-messages.py --range "$base..HEAD"
          else
            # After a force-push the old tip may not be fetched at all.
            # Validate all commits since the previous reachable release.
            base=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [[ -n "$base" ]]; then
              python3 scripts/check-commit-messages.py --range "$base..HEAD"
            else
              python3 scripts/check-commit-messages.py --range HEAD
            fi
          fi
