name: Test HDM
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lint
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck errors
        run: find . -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
      - name: Tests
        run: bash tests/run.sh
